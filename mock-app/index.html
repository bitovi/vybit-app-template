<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var s = document.createElement("script");
        // Detect GitHub Codespaces by hostname: {name}-{port}.{domain}
        var match = window.location.hostname.match(
          /^(.+)-\d+(\.app\.github\.dev|\.preview\.app\.github\.dev)$/
        );
        s.src = match
          ? "https://" + match[1] + "-3333" + match[2] + "/overlay.js"
          : "http://localhost:3333/overlay.js";
        s.onerror = function () {
          console.warn("Convey overlay is unavailable at port 3333");
        };
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
